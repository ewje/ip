plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

javafx {
    // Use a JavaFX version available on Maven Central.
    // (We use JDK 25 for the project; JavaFX can be on a different minor/major as long as it is compatible.)
    version = '24.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

jacoco {
    toolVersion = '0.8.14'
}

def testableClasses = sourceSets.main.output.asFileTree.matching {
    exclude 'duke/gui/**'
}

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(testableClasses)

    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(testableClasses)

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
        }
    }
}

test.finalizedBy jacocoTestReport
check.dependsOn jacocoTestCoverageVerification

application {
    // Entry point for the app.
    mainClass = 'duke.Duke'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'duke.jar'
}

run {
    standardInput = System.in
}

tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Runs the JavaFX GUI (Hello World check).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'duke.gui.GuiLauncher'
    // Java 25 warns that JavaFX needs native access; enable it to keep the output clean.
    jvmArgs '--enable-native-access=javafx.graphics'
}

checkstyle {
    toolVersion = '11.0.0'
}
